site_name: "Red Hat Enterprise Linux - Base de Conocimiento Didactica"
site_url: "https://diegoalejandrosaenzfalcon.github.io/Red-Hat-Enterprise-Linux/"
site_description: "Guias paso a paso para RHEL 10.2: WiFi, rendimiento, seguridad"
site_author: "Diego Alejandro Saenz Falcon"
copyright: "Copyright &copy; 2024 Diego Alejandro Saenz Falcon"

repo_url: "https://github.com/DiegoAlejandroSaenzFalcon/Red-Hat-Enterprise-Linux"
repo_name: "DiegoAlejandroSaenzFalcon/Red-Hat-Enterprise-Linux"

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: amber
    - scheme: slate
      primary: red
      accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Inicio: index.md
  - Guias:
    - WiFi Offline: guia-wifi-rhel10/README.md
    - Rendimiento: guia-rendimiento/README.md
    - Seguridad (CIS/STIG): guia-seguridad/README.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiegoAlejandroSaenzFalcon

plugins:
  - search
