site_name: "RHEL Enterprise Lab"
site_url: "https://diegoalejandrosaenzfalcon.github.io/Red-Hat-Enterprise-Linux/"
site_description: "Professional RHEL enterprise laboratory: administration, security, automation, incidents, evidence and AI governance."
site_author: "Diego Alejandro Saenz Falcon"

repo_url: "https://github.com/DiegoAlejandroSaenzFalcon/Red-Hat-Enterprise-Linux"
repo_name: "DiegoAlejandroSaenzFalcon/Red-Hat-Enterprise-Linux"

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: amber
    - scheme: slate
      primary: red
      accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Inicio: index.md
  - Proyecto:
    - Charter: PROJECT-CHARTER.md
    - Arquitectura: ARCHITECTURE.md
    - Gobernanza: GOVERNANCE.md
    - Estado: PROJECT-STATUS.md
  - Aprendizaje:
    - Ruta profesional: LEARNING-PATH.md
    - Matriz de laboratorio: LAB-MATRIX.md
  - IA:
    - Contrato IA: AI-CONTRACT.md
    - Seguridad IA: AI-SECURITY-CONTRACT.md
    - Operaciones IA: docs/ai/README.md
  - Operaciones:
    - Operaciones: docs/operations/README.md
    - Evidencia: EVIDENCE-STANDARD.md
  - Guías heredadas:
    - WiFi Offline: guia-wifi-rhel10/README.md
    - Rendimiento: guia-rendimiento/README.md
    - Seguridad CIS/STIG: guia-seguridad/README.md

plugins:
  - search
